<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">KSR - Kusto Slice Runner</title>
  <desc id="desc">Bold white KSR lettering on a rounded Kusto-purple tile, framed by luminous diagonal slices.</desc>
  <defs>
    <linearGradient id="tile" x1="4" y1="0" x2="58" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#49328D"/>
      <stop offset=".55" stop-color="#392979"/>
      <stop offset="1" stop-color="#2F2C69"/>
    </linearGradient>
    <radialGradient id="glow" cx="29" cy="30" r="43" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7241DA" stop-opacity=".26"/>
      <stop offset="1" stop-color="#7241DA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="upper-slice" x1="44" y1="-2" x2="35" y2="19" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A582FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#956CF1" stop-opacity=".35"/>
      <stop offset="1" stop-color="#AC86FF" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="lower-slice" x1="30" y1="45" x2="18" y2="67" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A981FF" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#9163EF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#9163EF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="8" y1="0" x2="48" y2="64" gradientUnits="userSpaceOnUse">
