name: KO Lite Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (strict SemVer, for example v1.2.3)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ko-lite-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate, package, and draft release
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Validate release request
        id: validate
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $version = $env:RELEASE_VERSION.Trim()
          if ($version -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
              throw "Release version '$version' is invalid. Use strict SemVer vMAJOR.MINOR.PATCH with no leading zeroes."
          }

          if ($env:GITHUB_REF -ne 'refs/heads/main') {
              throw "Releases must be dispatched from main, not '$env:GITHUB_REF'."
          }

          $checkoutSha = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
              throw 'Could not resolve the checked-out commit.'
          }
          if ($checkoutSha -ne $env:GITHUB_SHA) {
              throw "Checkout SHA '$checkoutSha' does not match the dispatch SHA '$env:GITHUB_SHA'."
          }

          $remoteTagLine = @(
              & git ls-remote --exit-code --tags origin "refs/tags/$version"
          ) | Select-Object -First 1
          $tagLookupExit = $LASTEXITCODE
          $tagExists = $tagLookupExit -eq 0
          if (-not $tagExists -and $tagLookupExit -ne 2) {
              throw "Could not verify whether tag '$version' exists (git exit code $tagLookupExit)."
          }
          if ($tagExists) {
              $remoteTagSha = ($remoteTagLine -split '\s+', 2)[0]
              if ($remoteTagSha -ne $env:GITHUB_SHA) {
                  throw "Tag '$version' already exists at '$remoteTagSha', not this run's exact SHA '$env:GITHUB_SHA'."
              }
          }

          $releaseMarker = "ko-lite-release-workflow:$version@$env:GITHUB_SHA"
          $releaseFilter = '.[] | select(.tag_name == "' + $version + '") | [.id, .draft, (.body // "" | contains("' + $releaseMarker + '")), .target_commitish] | @tsv'
          $releaseStates = @(
              @(
                  & gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq $releaseFilter
              ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )
          if ($LASTEXITCODE -ne 0) {
              throw "Could not verify whether release '$version' exists."
          }
          if ($releaseStates.Count -gt 1) {
              throw "GitHub returned multiple releases for '$version'."
          }

          $releaseId = ''
          $releaseMode = if ($releaseStates.Count -eq 1) {
              $parts = $releaseStates[0] -split "`t", 4
              if ($parts.Count -ne 4 -or $parts[1] -ne 'true' -or $parts[2] -ne 'true') {
                  throw "Release '$version' already exists and is not a resumable draft created for this exact workflow run."
              }
              if (-not $tagExists -and $parts[3] -ne $env:GITHUB_SHA) {
                  throw "Untagged draft release '$version' targets '$($parts[3])', not this run's exact SHA '$env:GITHUB_SHA'."
              }
              $releaseId = $parts[0]
              'resume-draft'
          } elseif ($tagExists) {
              'adopt-tag'
          } else {
              'create'
          }

          if ($releaseMode -eq 'create') {
              & git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
              if ($LASTEXITCODE -ne 0) {
                  throw 'Could not refresh origin/main.'
              }

              $mainSha = (& git rev-parse refs/remotes/origin/main).Trim()
              if ($LASTEXITCODE -ne 0) {
                  throw 'Could not resolve origin/main.'
              }
              if ($mainSha -ne $env:GITHUB_SHA) {
                  throw "The dispatch SHA '$env:GITHUB_SHA' is not the current origin/main SHA '$mainSha'. Dispatch the workflow again from main."
              }
          }

          [System.IO.File]::AppendAllText(
              $env:GITHUB_OUTPUT,
              "version=$version`npackage-version=$($version.Substring(1))`nrelease-mode=$releaseMode`nrelease-marker=$releaseMarker`nrelease-id=$releaseId`n",
              [System.Text.UTF8Encoding]::new($false))

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Restore JavaScript assets
        run: npm ci

      - name: Test browser route behavior
        run: npm run test:js

      - name: Restore .NET packages
        run: dotnet restore .\KoLite.Local.sln

      - name: Verify formatting
        run: dotnet format .\KoLite.Local.sln --verify-no-changes --no-restore --verbosity minimal

      - name: Build
        run: dotnet build .\KoLite.Local.sln --no-restore --nologo

      - name: Test
        run: dotnet test .\KoLite.Local.sln --no-build --nologo

      - name: Check NuGet vulnerabilities
        run: dotnet list .\KoLite.Local.sln package --vulnerable

      - name: Check npm vulnerabilities
        run: npm audit --omit=dev --audit-level=moderate

      - name: Publish release packages
        id: publish
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.version }}
          PACKAGE_VERSION: ${{ steps.validate.outputs.package-version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $releaseRoot = Join-Path $env:RUNNER_TEMP "ko-lite-release-$env:RELEASE_VERSION"
          if (Test-Path -LiteralPath $releaseRoot) {
              Remove-Item -LiteralPath $releaseRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $releaseRoot -Force | Out-Null

          $selfContainedName = "ko-lite-$env:RELEASE_VERSION-win-x64-self-contained"
          $frameworkDependentName = "ko-lite-$env:RELEASE_VERSION-win-x64-framework-dependent"
          $selfContainedPackage = Join-Path $releaseRoot $selfContainedName
          $frameworkDependentPackage = Join-Path $releaseRoot $frameworkDependentName
          $stampTargets = Join-Path $releaseRoot 'KoLite.ReleaseStamp.targets'

          # KoLite.LocalApp's normal target discovers the SHA from git only when the property is
          # empty. This release-only import makes the explicit KoLiteGitCommitSha property an
          # AssemblyMetadataAttribute without changing the application project.
          $stampTargetsXml = @'
          <Project>
            <Target Name="AddReleaseKoLiteGitCommitShaAttribute"
                    BeforeTargets="GetAssemblyAttributes"
                    Condition="'$(MSBuildProjectName)' == 'KoLite.LocalApp'">
              <ItemGroup>
                <AssemblyAttribute Include="System.Reflection.AssemblyMetadataAttribute">
                  <_Parameter1>KoLiteGitCommitSha</_Parameter1>
                  <_Parameter2>$(KoLiteGitCommitSha)</_Parameter2>
                </AssemblyAttribute>
              </ItemGroup>
            </Target>
          </Project>
          '@
          [System.IO.File]::WriteAllText(
              $stampTargets,
              $stampTargetsXml,
              [System.Text.UTF8Encoding]::new($false))

          $project = '.\src\KoLite.LocalApp\KoLite.LocalApp.csproj'
          $commonArguments = @(
              $project,
              '--configuration', 'Release',
              '--runtime', 'win-x64',
              '--nologo',
              "-p:Version=$env:PACKAGE_VERSION",
              "-p:KoLiteGitCommitSha=$env:RELEASE_SHA",
              "-p:DirectoryBuildTargetsPath=$stampTargets",
              '-p:ContinuousIntegrationBuild=true'
          )

          & dotnet publish @commonArguments `
              --self-contained true `
              --output $selfContainedPackage `
              --artifacts-path (Join-Path $releaseRoot 'artifacts-self-contained')
          if ($LASTEXITCODE -ne 0) {
              throw 'Self-contained publish failed.'
          }

          & dotnet publish @commonArguments `
              --self-contained false `
              --output $frameworkDependentPackage `
              --artifacts-path (Join-Path $releaseRoot 'artifacts-framework-dependent') `
              -p:UseAppHost=false
          if ($LASTEXITCODE -ne 0) {
              throw 'Framework-dependent publish failed.'
          }

          $packageFiles = @(
              '.\scripts\Start-KoLiteApp.ps1',
              '.\scripts\Stop-KoLiteApp.ps1',
              '.\README.md',
              '.\DEVELOPMENT.md',
              '.\CONTRIBUTING.md',
              '.\SECURITY.md',
              '.\SUPPORT.md',
              '.\THIRD-PARTY-NOTICES.md'
          )
          $skillsSource = '.\.github\skills'
          $releaseHighlightsScript = '.\scripts\New-KoLiteReleaseHighlights.ps1'
          $releasePrompt = '.\.github\prompts\release-notes-system.txt'

          foreach ($packageDirectory in @($selfContainedPackage, $frameworkDependentPackage)) {
              foreach ($source in $packageFiles) {
                  if (-not (Test-Path -LiteralPath $source)) {
                      throw "Required package file is missing: $source"
                  }
                  Copy-Item -LiteralPath $source -Destination $packageDirectory -Force
              }

              if (-not (Test-Path -LiteralPath $skillsSource)) {
                  throw "Required skills directory is missing: $skillsSource"
              }
              $packageGitHubDirectory = Join-Path $packageDirectory '.github'
              New-Item -ItemType Directory -Path $packageGitHubDirectory -Force | Out-Null
              Copy-Item -LiteralPath $skillsSource -Destination (Join-Path $packageGitHubDirectory 'skills') -Recurse -Force

              if (-not (Test-Path -LiteralPath $releaseHighlightsScript)) {
                  throw "Required release highlights script is missing: $releaseHighlightsScript"
              }
              $packageScriptsDirectory = Join-Path $packageDirectory 'scripts'
              New-Item -ItemType Directory -Path $packageScriptsDirectory -Force | Out-Null
              Copy-Item -LiteralPath $releaseHighlightsScript -Destination $packageScriptsDirectory -Force

              if (-not (Test-Path -LiteralPath $releasePrompt)) {
                  throw "Required release prompt is missing: $releasePrompt"
              }
              $packagePromptsDirectory = Join-Path $packageGitHubDirectory 'prompts'
              New-Item -ItemType Directory -Path $packagePromptsDirectory -Force | Out-Null
              Copy-Item -LiteralPath $releasePrompt -Destination $packagePromptsDirectory -Force
          }

          $workflowOutputs = (@(
              "release-root=$releaseRoot"
              "self-contained-name=$selfContainedName"
              "self-contained-package=$selfContainedPackage"
              "framework-dependent-name=$frameworkDependentName"
              "framework-dependent-package=$frameworkDependentPackage"
          ) -join "`n") + "`n"
          [System.IO.File]::AppendAllText(
              $env:GITHUB_OUTPUT,
              $workflowOutputs,
              [System.Text.UTF8Encoding]::new($false))

      - name: Smoke test published packages
        shell: pwsh
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ROOT: ${{ steps.publish.outputs.release-root }}
          SELF_CONTAINED_PACKAGE: ${{ steps.publish.outputs.self-contained-package }}
          FRAMEWORK_DEPENDENT_PACKAGE: ${{ steps.publish.outputs.framework-dependent-package }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Invoke-KoLiteSmokeTest {
              param(
                  [Parameter(Mandatory)][string]$Name,
                  [Parameter(Mandatory)][string]$FileName,
                  [string[]]$EntryArguments = @(),
                  [Parameter(Mandatory)][string]$WorkingDirectory,
                  [Parameter(Mandatory)][string]$DatabasePath,
                  [Parameter(Mandatory)][string]$BaseUrl,
                  [Parameter(Mandatory)][string]$StopScript
              )

              $process = [System.Diagnostics.Process]::new()
              $started = $false
              $stdoutTask = $null
              $stderrTask = $null
              $stdout = ''
              $stderr = ''
              $stdoutPath = Join-Path $env:RELEASE_ROOT "$Name.stdout.log"
              $stderrPath = Join-Path $env:RELEASE_ROOT "$Name.stderr.log"

              try {
                  $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
                  $startInfo.FileName = $FileName
                  $startInfo.WorkingDirectory = $WorkingDirectory
                  $startInfo.UseShellExecute = $false
                  $startInfo.RedirectStandardOutput = $true
                  $startInfo.RedirectStandardError = $true
                  $startInfo.Environment['DOTNET_NOLOGO'] = '1'

                  foreach ($argument in @($EntryArguments)) {
                      $startInfo.ArgumentList.Add($argument)
                  }
                  foreach ($argument in @(
                      "--ConnectionStrings:KoLiteSqlite=$DatabasePath",
                      '--KoLite:Scheduler:Enabled=false',
                      '--KoLite:Retention:Enabled=false',
                      '--KoLite:UpdateCheck:Enabled=false',
                      '--KoLite:Kusto:AuthMode=AzureCli',
                      "--KoLite:Urls=$BaseUrl"
                  )) {
                      $startInfo.ArgumentList.Add($argument)
                  }

                  $process.StartInfo = $startInfo
                  if (-not $process.Start()) {
                      throw "Could not start the $Name package."
                  }
                  $started = $true
                  $stdoutTask = $process.StandardOutput.ReadToEndAsync()
                  $stderrTask = $process.StandardError.ReadToEndAsync()

                  $deadline = [DateTimeOffset]::UtcNow.AddMinutes(2)
                  $health = $null
                  while ([DateTimeOffset]::UtcNow -lt $deadline) {
                      if ($process.HasExited) {
                          throw "$Name exited before becoming healthy with exit code $($process.ExitCode)."
                      }

                      try {
                          $health = Invoke-RestMethod -Method Get -Uri "$BaseUrl/healthz" -TimeoutSec 3
                          if ($health.status -eq 'healthy') {
                              break
                          }
                      } catch {
                          $health = $null
                      }
                      Start-Sleep -Seconds 1
                  }

                  if ($null -eq $health) {
                      throw "$Name did not become healthy within two minutes."
                  }
                  $systemStatus = Invoke-RestMethod -Method Get -Uri "$BaseUrl/api/v1/system/status" -TimeoutSec 5
                  if ($systemStatus.scheduler.enabled -ne $false) {
                      throw "$Name smoke test unexpectedly started with scheduling enabled."
                  }

                  $expectedDatabasePath = [System.IO.Path]::GetFullPath($DatabasePath)
                  $reportedDatabasePath = [System.IO.Path]::GetFullPath([string]$systemStatus.database.path)
                  if (-not [string]::Equals(
                      $expectedDatabasePath,
                      $reportedDatabasePath,
                      [System.StringComparison]::OrdinalIgnoreCase)) {
                      throw "$Name reported database '$reportedDatabasePath' instead of '$expectedDatabasePath'."
                  }

                  $builtSha = [string]$systemStatus.update.builtSha
                  if (-not [string]::Equals(
                      $builtSha,
                      $env:RELEASE_SHA,
                      [System.StringComparison]::OrdinalIgnoreCase)) {
                      throw "$Name reported KoLiteGitCommitSha '$builtSha' instead of '$env:RELEASE_SHA'."
                  }

                  & $StopScript `
                      -BaseUrl $BaseUrl `
                      -Reason "release-smoke-$Name" `
                      -Timeout ([TimeSpan]::FromMinutes(2)) `
                      -PollIntervalSeconds 1

                  if (-not $process.WaitForExit(30000)) {
                      throw "$Name did not exit after its graceful drain completed."
                  }
                  if ($process.ExitCode -ne 0) {
                      throw "$Name exited with code $($process.ExitCode) after graceful drain."
                  }
              } finally {
                  if ($started -and -not $process.HasExited) {
                      try {
                          Stop-Process -Id $process.Id -ErrorAction Stop
                          $process.WaitForExit()
                      } catch {
                          Write-Warning "Could not clean up $Name process $($process.Id): $($_.Exception.Message)"
                      }
                  }

                  if ($null -ne $stdoutTask) {
                      $stdout = $stdoutTask.GetAwaiter().GetResult()
                  }
                  if ($null -ne $stderrTask) {
                      $stderr = $stderrTask.GetAwaiter().GetResult()
                  }
                  [System.IO.File]::WriteAllText($stdoutPath, $stdout, [System.Text.UTF8Encoding]::new($false))
                  [System.IO.File]::WriteAllText($stderrPath, $stderr, [System.Text.UTF8Encoding]::new($false))
                  $process.Dispose()

                  Get-ChildItem -Path "$DatabasePath*" -ErrorAction SilentlyContinue |
                      Remove-Item -Force -ErrorAction SilentlyContinue
              }
          }

          $selfContainedStop = Join-Path $env:SELF_CONTAINED_PACKAGE 'Stop-KoLiteApp.ps1'
          Invoke-KoLiteSmokeTest `
              -Name 'self-contained' `
              -FileName (Join-Path $env:SELF_CONTAINED_PACKAGE 'KoLite.LocalApp.exe') `
              -WorkingDirectory $env:SELF_CONTAINED_PACKAGE `
              -DatabasePath (Join-Path $env:RELEASE_ROOT 'smoke-self-contained.db') `
              -BaseUrl 'http://127.0.0.1:5097' `
              -StopScript $selfContainedStop

          $dotnetPath = (Get-Command dotnet -ErrorAction Stop).Source
          $frameworkDependentStop = Join-Path $env:FRAMEWORK_DEPENDENT_PACKAGE 'Stop-KoLiteApp.ps1'
          Invoke-KoLiteSmokeTest `
              -Name 'framework-dependent' `
              -FileName $dotnetPath `
              -EntryArguments @((Join-Path $env:FRAMEWORK_DEPENDENT_PACKAGE 'KoLite.LocalApp.dll')) `
              -WorkingDirectory $env:FRAMEWORK_DEPENDENT_PACKAGE `
              -DatabasePath (Join-Path $env:RELEASE_ROOT 'smoke-framework-dependent.db') `
              -BaseUrl 'http://127.0.0.1:5098' `
              -StopScript $frameworkDependentStop

      - name: Create ZIP archives and checksums
        id: archive
        shell: pwsh
        env:
          RELEASE_ROOT: ${{ steps.publish.outputs.release-root }}
          SELF_CONTAINED_NAME: ${{ steps.publish.outputs.self-contained-name }}
          SELF_CONTAINED_PACKAGE: ${{ steps.publish.outputs.self-contained-package }}
          FRAMEWORK_DEPENDENT_NAME: ${{ steps.publish.outputs.framework-dependent-name }}
          FRAMEWORK_DEPENDENT_PACKAGE: ${{ steps.publish.outputs.framework-dependent-package }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $assetDirectory = Join-Path $env:RELEASE_ROOT 'assets'
          New-Item -ItemType Directory -Path $assetDirectory -Force | Out-Null

          $selfContainedZip = Join-Path $assetDirectory "$env:SELF_CONTAINED_NAME.zip"
          $frameworkDependentZip = Join-Path $assetDirectory "$env:FRAMEWORK_DEPENDENT_NAME.zip"

          function New-DeterministicZip {
              param(
                  [Parameter(Mandatory)][string]$SourceDirectory,
                  [Parameter(Mandatory)][string]$DestinationPath
              )

              $archiveStream = [System.IO.File]::Open(
                  $DestinationPath,
                  [System.IO.FileMode]::CreateNew,
                  [System.IO.FileAccess]::Write,
                  [System.IO.FileShare]::None)
              $archive = [System.IO.Compression.ZipArchive]::new(
                  $archiveStream,
                  [System.IO.Compression.ZipArchiveMode]::Create,
                  $false)
              try {
                  $files = Get-ChildItem -LiteralPath $SourceDirectory -File -Recurse |
                      Sort-Object FullName
                  foreach ($file in $files) {
                      $relativePath = [System.IO.Path]::GetRelativePath(
                          $SourceDirectory,
                          $file.FullName).Replace('\', '/')
                      $entry = $archive.CreateEntry(
                          $relativePath,
                          [System.IO.Compression.CompressionLevel]::Optimal)
                      $entry.LastWriteTime = [DateTimeOffset]::new(
                          2000, 1, 1, 0, 0, 0, [TimeSpan]::Zero)

                      $inputStream = [System.IO.File]::OpenRead($file.FullName)
                      $outputStream = $entry.Open()
                      try {
                          $inputStream.CopyTo($outputStream)
                      } finally {
                          $outputStream.Dispose()
                          $inputStream.Dispose()
                      }
                  }
              } finally {
                  $archive.Dispose()
                  $archiveStream.Dispose()
              }
          }

          New-DeterministicZip `
              -SourceDirectory $env:SELF_CONTAINED_PACKAGE `
              -DestinationPath $selfContainedZip
          New-DeterministicZip `
              -SourceDirectory $env:FRAMEWORK_DEPENDENT_PACKAGE `
              -DestinationPath $frameworkDependentZip

          foreach ($archive in @($selfContainedZip, $frameworkDependentZip)) {
              $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
              try {
                  $entryNames = @($zip.Entries | ForEach-Object FullName)
                  if ($entryNames -notcontains 'Start-KoLiteApp.ps1') {
                      throw "Archive '$archive' does not have Start-KoLiteApp.ps1 at its package root."
                  }
                  if ($entryNames -notcontains 'Stop-KoLiteApp.ps1') {
                      throw "Archive '$archive' does not have Stop-KoLiteApp.ps1 at its package root."
                  }
                  if (-not ($entryNames | Where-Object { $_ -like '.github/skills/*' })) {
                      throw "Archive '$archive' is missing .github/skills."
                  }
              } finally {
                  $zip.Dispose()
              }
          }

          $checksumPath = Join-Path $assetDirectory 'SHA256SUMS.txt'
          $checksumLines = foreach ($archive in @($selfContainedZip, $frameworkDependentZip)) {
              $hash = Get-FileHash -LiteralPath $archive -Algorithm SHA256
              "$($hash.Hash.ToLowerInvariant())  $(Split-Path -Leaf $archive)"
          }
          [System.IO.File]::WriteAllLines(
              $checksumPath,
              $checksumLines,
              [System.Text.UTF8Encoding]::new($false))

          $workflowOutputs = (@(
              "self-contained-zip=$selfContainedZip"
              "framework-dependent-zip=$frameworkDependentZip"
              "checksums=$checksumPath"
          ) -join "`n") + "`n"
          [System.IO.File]::AppendAllText(
              $env:GITHUB_OUTPUT,
              $workflowOutputs,
              [System.Text.UTF8Encoding]::new($false))

      - name: Generate complete GitHub release notes
        id: generated-notes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ROOT: ${{ steps.publish.outputs.release-root }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $publishedReleaseLines = @(
              & gh api `
                  --paginate `
                  "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" `
                  --jq '.[] | select(.draft == false and .published_at != null) | [.published_at, .tag_name] | @tsv'
          )
          if ($LASTEXITCODE -ne 0) {
              throw 'Could not identify the prior published release.'
          }

          $publishedReleases = foreach ($line in $publishedReleaseLines) {
              if ([string]::IsNullOrWhiteSpace($line)) {
                  continue
              }
              $parts = $line -split "`t", 2
              if ($parts.Count -eq 2) {
                  [pscustomobject]@{
                      PublishedAt = [DateTimeOffset]::Parse($parts[0])
                      Tag = $parts[1]
                  }
              }
          }
          $previousRelease = $publishedReleases |
              Sort-Object PublishedAt -Descending |
              Select-Object -First 1
          $previousTag = if ($null -eq $previousRelease) { '' } else { $previousRelease.Tag }

          $payload = [ordered]@{
              tag_name = $env:RELEASE_VERSION
              target_commitish = $env:RELEASE_SHA
              configuration_file_path = '.github/release.yml'
          }
          if (-not [string]::IsNullOrWhiteSpace($previousTag)) {
              $payload['previous_tag_name'] = $previousTag
          }

          $groundingDirectory = Join-Path $env:RELEASE_ROOT 'release-note-grounding'
          New-Item -ItemType Directory -Path $groundingDirectory -Force | Out-Null
          $payloadPath = Join-Path $groundingDirectory 'generate-notes-request.json'
          $rawResponsePath = Join-Path $groundingDirectory 'generate-notes-response.json'
          $generatedBodyPath = Join-Path $groundingDirectory 'generated-notes.md'
          $groundingPath = Join-Path $groundingDirectory 'ai-grounding.md'

          [System.IO.File]::WriteAllText(
              $payloadPath,
              ($payload | ConvertTo-Json -Depth 5),
              [System.Text.UTF8Encoding]::new($false))

          $rawResponseLines = @(
              & gh api `
                  --method POST `
                  "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" `
                  --input $payloadPath
          )
          if ($LASTEXITCODE -ne 0) {
              throw 'GitHub could not generate the release notes.'
          }
          $rawResponse = $rawResponseLines -join "`n"
          $generated = $rawResponse | ConvertFrom-Json
          $generatedBody = [string]$generated.body
          $generatedName = [string]$generated.name

          [System.IO.File]::WriteAllText(
              $rawResponsePath,
              $rawResponse,
              [System.Text.UTF8Encoding]::new($false))
          [System.IO.File]::WriteAllText(
              $generatedBodyPath,
              $generatedBody,
              [System.Text.UTF8Encoding]::new($false))

          $previousDisplay = if ([string]::IsNullOrWhiteSpace($previousTag)) {
              '(none; GitHub selected the initial comparison range)'
          } else {
              $previousTag
          }
          $grounding = @"
          # KO Lite release-note grounding

          - Target version: $env:RELEASE_VERSION
          - Target commit: $env:RELEASE_SHA
          - Prior published release: $previousDisplay
          - GitHub-generated release name: $generatedName

          ## Complete GitHub-generated notes

          $generatedBody
          "@
          [System.IO.File]::WriteAllText(
              $groundingPath,
              $grounding,
              [System.Text.UTF8Encoding]::new($false))

          $workflowOutputs = (@(
              "previous-tag=$previousTag"
              "grounding-dir=$groundingDirectory"
              "grounding-file=$groundingPath"
              "generated-body-file=$generatedBodyPath"
          ) -join "`n") + "`n"
          [System.IO.File]::AppendAllText(
              $env:GITHUB_OUTPUT,
              $workflowOutputs,
              [System.Text.UTF8Encoding]::new($false))

      - name: Compose deterministic release body
        id: compose
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_MARKER: ${{ steps.validate.outputs.release-marker }}
          RELEASE_ROOT: ${{ steps.publish.outputs.release-root }}
          GROUNDING_DIRECTORY: ${{ steps.generated-notes.outputs.grounding-dir }}
          PREVIOUS_TAG: ${{ steps.generated-notes.outputs.previous-tag }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $aiStatus = @'
          Actions AI was not attempted.
          Local Copilot post-processing is supported by scripts\New-KoLiteReleaseHighlights.ps1.
          The release-highlights skill previews reviewed local Copilot output before applying only
          the Changes section of this draft.
          '@
          [System.IO.File]::WriteAllText(
              (Join-Path $env:GROUNDING_DIRECTORY 'ai-status.txt'),
              $aiStatus,
              [System.Text.UTF8Encoding]::new($false))

          $changesTemplate = @'
          ## Changes

          _Use the `ko-lite-release-highlights` skill to generate, review, and apply this section._
          '@
          $changes = $changesTemplate

          $installTemplate = @'
          ## Install

          Download and extract one Windows x64 archive:

          - **Self-contained:** `ko-lite-{{version}}-win-x64-self-contained.zip` includes the .NET runtime.

          - **Framework-dependent:** `ko-lite-{{version}}-win-x64-framework-dependent.zip` requires the .NET 10 ASP.NET Core Runtime (x64).

          Both archives extract with `Start-KoLiteApp.ps1` at the package root:

          ```powershell
          .\Start-KoLiteApp.ps1
          ```

          Open `http://127.0.0.1:5057`.
          '@
          $install = $installTemplate.Replace('{{version}}', $env:RELEASE_VERSION)

          $fullChangelogUrl = if ([string]::IsNullOrWhiteSpace($env:PREVIOUS_TAG)) {
              "https://github.com/$env:GITHUB_REPOSITORY/commits/$env:RELEASE_VERSION"
          } else {
              "https://github.com/$env:GITHUB_REPOSITORY/compare/$env:PREVIOUS_TAG...$env:RELEASE_VERSION"
          }
          $fullChangelog = "## Full Changelog`n`n$fullChangelogUrl"

          $bodyParts = [System.Collections.Generic.List[string]]::new()
          $bodyParts.Add($changes)
          $bodyParts.Add($install)
          $bodyParts.Add($fullChangelog)
          $bodyParts.Add("<!-- $env:RELEASE_MARKER -->")

          $releaseBody = $bodyParts -join "`n`n"
          $releaseBodyPath = Join-Path $env:RELEASE_ROOT 'release-body.md'
          [System.IO.File]::WriteAllText(
              $releaseBodyPath,
              $releaseBody,
              [System.Text.UTF8Encoding]::new($false))

          [System.IO.File]::AppendAllText(
              $env:GITHUB_OUTPUT,
              "release-body=$releaseBodyPath`n",
              [System.Text.UTF8Encoding]::new($false))

      - name: Upload release-note grounding
        uses: actions/upload-artifact@v7
        with:
          name: ko-lite-release-grounding-${{ steps.validate.outputs.version }}
          path: ${{ steps.generated-notes.outputs.grounding-dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Create draft release
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_MODE: ${{ steps.validate.outputs.release-mode }}
          RELEASE_MARKER: ${{ steps.validate.outputs.release-marker }}
          RELEASE_ID: ${{ steps.validate.outputs.release-id }}
          RELEASE_BODY: ${{ steps.compose.outputs.release-body }}
          SELF_CONTAINED_ZIP: ${{ steps.archive.outputs.self-contained-zip }}
          FRAMEWORK_DEPENDENT_ZIP: ${{ steps.archive.outputs.framework-dependent-zip }}
          CHECKSUMS: ${{ steps.archive.outputs.checksums }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $remoteTagLine = @(
              & git ls-remote --exit-code --tags origin "refs/tags/$env:RELEASE_VERSION"
          ) | Select-Object -First 1
          $tagLookupExit = $LASTEXITCODE
          $tagExists = $tagLookupExit -eq 0
          if (-not $tagExists -and $tagLookupExit -ne 2) {
              throw "Could not recheck tag '$env:RELEASE_VERSION' (git exit code $tagLookupExit)."
          }
          if ($tagExists) {
              $remoteTagSha = ($remoteTagLine -split '\s+', 2)[0]
              if ($remoteTagSha -ne $env:RELEASE_SHA) {
                  throw "Tag '$env:RELEASE_VERSION' now targets '$remoteTagSha', not this run's exact SHA '$env:RELEASE_SHA'."
              }
          }

          $releaseFilter = '.[] | select(.tag_name == "' + $env:RELEASE_VERSION + '") | [.id, .draft, (.body // "" | contains("' + $env:RELEASE_MARKER + '")), .target_commitish] | @tsv'
          $releaseStates = @(
              @(
                  & gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq $releaseFilter
              ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )
          if ($LASTEXITCODE -ne 0) {
              throw "Could not recheck release '$env:RELEASE_VERSION'."
          }
          if ($releaseStates.Count -gt 1) {
              throw "GitHub returned multiple releases for '$env:RELEASE_VERSION'."
          }

          switch ($env:RELEASE_MODE) {
              'create' {
                  if ($tagExists -or $releaseStates.Count -ne 0) {
                      throw "Tag or release '$env:RELEASE_VERSION' appeared during the workflow."
                  }
              }
              'adopt-tag' {
                  if (-not $tagExists -or $releaseStates.Count -ne 0) {
                      throw "Tag '$env:RELEASE_VERSION' is no longer an unowned exact-SHA tag."
                  }
              }
              'resume-draft' {
                  if ($releaseStates.Count -ne 1) {
                      throw "Draft release '$env:RELEASE_VERSION' is no longer resumable."
                  }
                  $parts = $releaseStates[0] -split "`t", 4
                  if ($parts.Count -ne 4 -or $parts[1] -ne 'true' -or $parts[2] -ne 'true') {
                      throw "Release '$env:RELEASE_VERSION' is no longer the workflow-owned draft."
                  }
                  if ($parts[0] -ne $env:RELEASE_ID) {
                      throw "Release '$env:RELEASE_VERSION' no longer has the expected release id '$env:RELEASE_ID'."
                  }
                  if (-not $tagExists -and $parts[3] -ne $env:RELEASE_SHA) {
                      throw "Untagged draft release '$env:RELEASE_VERSION' no longer targets this run's exact SHA."
                  }
              }
              default {
                  throw "Unknown release mode '$env:RELEASE_MODE'."
              }
          }

          foreach ($asset in @(
              $env:SELF_CONTAINED_ZIP,
              $env:FRAMEWORK_DEPENDENT_ZIP,
              $env:CHECKSUMS,
              $env:RELEASE_BODY
          )) {
              if (-not (Test-Path -LiteralPath $asset)) {
                  throw "Required release file is missing: $asset"
              }
          }

          if ($env:RELEASE_MODE -eq 'resume-draft') {
              function Assert-OwnedDraft {
                  $ownedDraftFilter = '[.id, .tag_name, .draft, (.body // "" | contains("' + $env:RELEASE_MARKER + '")), .target_commitish] | @tsv'
                  $state = @(
                      & gh api `
                          "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" `
                          --jq $ownedDraftFilter
                  ) | Select-Object -First 1
                  if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($state)) {
                      throw "Could not verify resumable draft release id '$env:RELEASE_ID'."
                  }
                  $stateParts = $state -split "`t", 5
                  if ($stateParts.Count -ne 5 -or
                      $stateParts[0] -ne $env:RELEASE_ID -or
                      $stateParts[1] -ne $env:RELEASE_VERSION -or
                      $stateParts[2] -ne 'true' -or
                      $stateParts[3] -ne 'true') {
                      throw "Release '$env:RELEASE_VERSION' is no longer the workflow-owned draft; no assets were changed."
                  }

                  $currentTagLine = @(
                      & git ls-remote --exit-code --tags origin "refs/tags/$env:RELEASE_VERSION"
                  ) | Select-Object -First 1
                  $currentTagLookupExit = $LASTEXITCODE
                  if ($currentTagLookupExit -eq 0) {
                      $currentTagSha = ($currentTagLine -split '\s+', 2)[0]
                      if ($currentTagSha -ne $env:RELEASE_SHA) {
                          throw "Tag '$env:RELEASE_VERSION' no longer targets this run's exact SHA; no assets were changed."
                      }
                  } elseif ($currentTagLookupExit -eq 2) {
                      if ($stateParts[4] -ne $env:RELEASE_SHA) {
                          throw "Untagged draft release '$env:RELEASE_VERSION' no longer targets this run's exact SHA; no assets were changed."
                      }
                  } else {
                      throw "Could not verify tag state for draft release '$env:RELEASE_VERSION'; no assets were changed."
                  }
              }

              $assetStates = @{}
              $assetDigests = @{}
              $assetLines = @(
                  & gh api `
                      --paginate `
                      "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID/assets?per_page=100" `
                      --jq '.[] | [.name, .state, (.digest // "")] | @tsv'
              )
              if ($LASTEXITCODE -ne 0) {
                  throw "Could not inspect assets for draft release '$env:RELEASE_VERSION'."
              }
              foreach ($assetLine in $assetLines) {
                  if ([string]::IsNullOrWhiteSpace($assetLine)) {
                      continue
                  }
                  $assetParts = $assetLine -split "`t", 3
                  if ($assetParts.Count -eq 3) {
                      $assetStates[$assetParts[0]] = $assetParts[1]
                      $assetDigests[$assetParts[0]] = $assetParts[2]
                  }
              }

              $desiredAssets = @(
                  $env:SELF_CONTAINED_ZIP,
                  $env:FRAMEWORK_DEPENDENT_ZIP,
                  $env:CHECKSUMS
              )
              $missingAssets = [System.Collections.Generic.List[string]]::new()
              foreach ($asset in $desiredAssets) {
                  $assetName = Split-Path -Leaf $asset
                  if ($assetStates.ContainsKey($assetName)) {
                      if ($assetStates[$assetName] -ne 'uploaded') {
                          throw "Existing asset '$assetName' is not fully uploaded. Remove that draft asset, then re-run this same workflow run."
                      }
                      $localHash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
                      $expectedDigest = "sha256:$localHash"
                      if (-not [string]::Equals(
                          [string]$assetDigests[$assetName],
                          $expectedDigest,
                          [System.StringComparison]::OrdinalIgnoreCase)) {
                          throw "Existing asset '$assetName' does not match this attempt's SHA-256 digest. Remove that draft asset, then re-run this same workflow run."
                      }
                      continue
                  }

                  $missingAssets.Add($asset)
              }

              foreach ($asset in $missingAssets) {
                  $assetName = Split-Path -Leaf $asset
                  Assert-OwnedDraft
                  & gh release upload $env:RELEASE_VERSION `
                      --repo $env:GITHUB_REPOSITORY `
                      $asset
                  if ($LASTEXITCODE -ne 0) {
                      throw "Could not upload '$assetName' to draft release '$env:RELEASE_VERSION'. Re-run this same workflow run to resume it."
                  }
              }
              Assert-OwnedDraft
          } elseif ($env:RELEASE_MODE -eq 'adopt-tag') {
              & gh release create $env:RELEASE_VERSION `
                  --repo $env:GITHUB_REPOSITORY `
                  --verify-tag `
                  --fail-on-no-commits `
                  --title "KO Lite $env:RELEASE_VERSION" `
                  --notes-file $env:RELEASE_BODY `
                  --draft `
                  $env:SELF_CONTAINED_ZIP `
                  $env:FRAMEWORK_DEPENDENT_ZIP `
                  $env:CHECKSUMS
              if ($LASTEXITCODE -ne 0) {
                  throw "Could not create draft release '$env:RELEASE_VERSION' from its exact-SHA tag. Re-run the workflow to resume it."
              }
          } else {
              & gh release create $env:RELEASE_VERSION `
                  --repo $env:GITHUB_REPOSITORY `
                  --target $env:RELEASE_SHA `
                  --fail-on-no-commits `
                  --title "KO Lite $env:RELEASE_VERSION" `
                  --notes-file $env:RELEASE_BODY `
                  --draft `
                  $env:SELF_CONTAINED_ZIP `
                  $env:FRAMEWORK_DEPENDENT_ZIP `
                  $env:CHECKSUMS
              if ($LASTEXITCODE -ne 0) {
                  throw "Could not create draft release '$env:RELEASE_VERSION'. Re-run the workflow to resume any exact-SHA tag or owned draft."
              }
          }

          $releaseView = $null
          $lastReleaseViewError = 'No response was returned.'
          foreach ($attempt in 1..6) {
              $releaseViewOutput = @(
                  & gh release view $env:RELEASE_VERSION `
                      --repo $env:GITHUB_REPOSITORY `
                      --json databaseId,isDraft,tagName,targetCommitish,body,url 2>&1
              ) -join "`n"
              $releaseViewExit = $LASTEXITCODE

              if ($releaseViewExit -eq 0) {
                  try {
                      $releaseView = $releaseViewOutput | ConvertFrom-Json
                      break
                  } catch {
                      $lastReleaseViewError = "GitHub returned invalid release JSON: $($_.Exception.Message)"
                  }
              } else {
                  $lastReleaseViewError = if ([string]::IsNullOrWhiteSpace($releaseViewOutput)) {
                      "gh release view exited with code $releaseViewExit."
                  } else {
                      $releaseViewOutput.Trim()
                  }
              }

              if ($attempt -lt 6) {
                  Start-Sleep -Seconds 2
              }
          }

          if ($null -eq $releaseView) {
              throw "Draft release '$env:RELEASE_VERSION' could not be read after six attempts. Last error: $lastReleaseViewError"
          }
          if ([string]$releaseView.tagName -ne $env:RELEASE_VERSION) {
              throw "Release lookup returned tag '$($releaseView.tagName)' instead of '$env:RELEASE_VERSION'."
          }
          if ($releaseView.isDraft -ne $true) {
              throw "Release '$env:RELEASE_VERSION' exists but is not a draft."
          }
          if (-not ([string]$releaseView.body).Contains($env:RELEASE_MARKER, [System.StringComparison]::Ordinal)) {
              throw "Release '$env:RELEASE_VERSION' is not the expected workflow-owned draft."
          }
          if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_ID) -and
              [string]$releaseView.databaseId -ne $env:RELEASE_ID) {
              throw "Release '$env:RELEASE_VERSION' no longer has the expected release id '$env:RELEASE_ID'."
          }

          $remoteTagLine = @(
              & git ls-remote --tags origin "refs/tags/$env:RELEASE_VERSION"
          ) | Select-Object -First 1
          $tagLookupExit = $LASTEXITCODE
          if ($tagLookupExit -ne 0) {
              throw "Could not verify whether draft release '$env:RELEASE_VERSION' already has a Git tag."
          }
          if (-not [string]::IsNullOrWhiteSpace($remoteTagLine)) {
              $remoteTagSha = ($remoteTagLine -split '\s+', 2)[0]
              if ($remoteTagSha -ne $env:RELEASE_SHA) {
                  throw "Remote tag '$env:RELEASE_VERSION' resolves to '$remoteTagSha' instead of exact SHA '$env:RELEASE_SHA'."
              }
          } else {
              if ([string]$releaseView.targetCommitish -ne $env:RELEASE_SHA) {
                  throw "Untagged draft release '$env:RELEASE_VERSION' targets '$($releaseView.targetCommitish)' instead of exact SHA '$env:RELEASE_SHA'."
              }
          }

          Write-Host "Verified draft release '$env:RELEASE_VERSION' at exact SHA '$env:RELEASE_SHA'."
          exit 0
