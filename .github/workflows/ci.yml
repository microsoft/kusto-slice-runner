name: Kusto Slice Runner CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Restore JavaScript assets
        run: npm ci

      - name: Test browser behavior
        run: npm run test:js

      - name: Restore .NET packages
        run: dotnet restore .\Ksr.Local.sln

      - name: Verify formatting
        run: dotnet format .\Ksr.Local.sln --verify-no-changes --no-restore --verbosity minimal

      - name: Build
        run: dotnet build .\Ksr.Local.sln --no-restore --nologo

      - name: Test
        run: dotnet test .\Ksr.Local.sln --no-build --nologo --logger "console;verbosity=normal" -- xUnit.ShowLiveOutput=true

      - name: Check NuGet vulnerabilities
        run: dotnet list .\Ksr.Local.sln package --vulnerable

      - name: Check npm vulnerabilities
        run: npm audit --omit=dev --audit-level=moderate

      - name: Publish smoke
        run: dotnet publish .\src\Ksr.LocalApp\Ksr.LocalApp.csproj --configuration Release --output "$env:RUNNER_TEMP\ksr-publish" --nologo
